# ponytail: CMS push → auto build → auto deploy. No manual wrangler needed.
name: Build & Deploy

on:
  push:
    branches: [main]
  # ponytail: workflow_dispatch only needs actions:write (not contents:write)
  # Sanity webhook calls this endpoint directly
  workflow_dispatch:
  repository_dispatch:
    types: [sanity_update]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name yakeen-lighting --branch main
