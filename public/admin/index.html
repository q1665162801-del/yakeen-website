<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Yakeen 产品管理后台</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { margin: 0; }
    .login-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .login-card {
      background: #16213e;
      padding: 48px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      text-align: center;
      max-width: 400px;
    }
    .login-card h1 { font-size: 24px; margin: 0 0 8px; color: #d4af37; }
    .login-card p { font-size: 14px; color: #888; margin: 0 0 24px; }
    .login-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #d4af37;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform .2s;
    }
    .login-btn:hover { transform: scale(1.05); }
    .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 16px; }
    /* ponytail: card thumbnail injection — Decap CMS doesn't auto-render JSON entry images */
    .nc-entryCard-card img[data-thumb] {
      width: 100% !important;
      height: 140px !important;
      object-fit: cover !important;
      border-radius: 8px 8px 0 0 !important;
    }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>Yakeen Admin</h1>
      <p>产品管理后台</p>
      <div id="error" class="error-msg"></div>
      <a href="/api/oauth" class="login-btn">Login with GitHub</a>
    </div>
  </div>
  <script>
  (function() {
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);

    // Handle OAuth error from full-page redirect
    if (params.get('error')) {
      document.getElementById('error').textContent = decodeURIComponent(params.get('error'));
      document.getElementById('login').style.display = 'flex';
      history.replaceState(null, '', window.location.pathname);
      return;
    }

    // Check if already authenticated
    if (!localStorage.getItem('netlify-cms-user')) {
      // Not authenticated — show our login page (full-page redirect, no popup)
      document.getElementById('login').style.display = 'flex';
      return;
    }

    // Authenticated — dynamically load Decap CMS
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js';
    document.body.appendChild(s);

    // Fallback: localStorage relay for CMS's own popup-based login
    // (in case CMS doesn't recognize netlify-cms-user and shows its own login)
    var KEY = 'decap_cms_oauth';
    var prov = 'github';

    function relay(stored) {
      var origin = window.location.origin;
      var parsed;
      try { parsed = JSON.parse(stored); } catch(e) { return; }

      window.dispatchEvent(new MessageEvent('message', {
        data: 'authorizing:' + prov,
        origin: origin,
        source: window
      }));

      setTimeout(function() {
        var msgData;
        if (parsed.token) {
          msgData = 'authorization:' + prov + ':success:' + JSON.stringify(parsed);
        } else if (parsed.error) {
          msgData = 'authorization:' + prov + ':error:' + JSON.stringify({ msg: parsed.error });
        }
        if (msgData) {
          window.dispatchEvent(new MessageEvent('message', {
            data: msgData,
            origin: origin,
            source: window
          }));
        }
      }, 150);
    }

    var poll = setInterval(function() {
      var stored = localStorage.getItem(KEY);
      if (!stored) return;
      localStorage.removeItem(KEY);
      relay(stored);
    }, 400);

    setTimeout(function() { clearInterval(poll); }, 300000);
  })();

  // ponytail: 3-strategy thumbnail fix for Decap CMS card view
  // Strategy 1: global img error handler — fixes broken image URLs
  // Strategy 2: text-based card matching — finds cards by product name text
  // Strategy 3: href-based card matching — finds cards by entry slug in href

  var IMG_BASE = '/assets/images/products/';
  // slug → image filename
  var SLUG_IMG = {
    "panel-light":"panel-new.webp","large-downlight":"large-downlight-85057.jpeg",
    "wall-light":"wall-light-01.jpeg","optical-line-zgl062":"optical-line-zgl062.jpeg",
    "magnetic-track":"magnetic-track-48v.jpeg","optical-line-zgl070":"optical-line-zgl070.jpeg",
    "linear-pendant":"linear-pendant-lc005.jpeg","solar-street":"solar-street.jpg",
    "wall-washer":"led-wall-washer.jpeg","ufo-highbay":"highbay-new.webp",
    "flood-light":"flood-light.jpg","df-downlight":"narrow-beam-js172.jpeg",
    "spotlight":"spotlight-new.webp","cold-forged-spotlight":"cold-forged-js006.jpeg",
    "grid-spotlight":"mini-spotlight-x01.jpeg","magnetic-track-fixture":"magnetic-track-fixture.jpeg"
  };
  // product name → image URL (for text-based matching)
  var NAME_IMG = {
    "Cold Forged LED Spotlight": IMG_BASE+"cold-forged-js006.jpeg",
    "Mini Recessed LED Spotlight": IMG_BASE+"mini-spotlight-x01.jpeg",
    "Large Format Commercial LED Downlight": IMG_BASE+"large-downlight-85057.jpeg",
    "Narrow Beam Anti-Glare LED Downlight": IMG_BASE+"narrow-beam-js172.jpeg",
    "Commercial LED Track Spotlight": IMG_BASE+"spotlight-new.webp",
    "48V Magnetic Track Light System": IMG_BASE+"magnetic-track-48v.jpeg",
    "Magnetic Track Light Modules": IMG_BASE+"magnetic-track-fixture.jpeg",
    "Architectural Linear Pendant Light": IMG_BASE+"linear-pendant-lc005.jpeg",
    "Optical Line Light — Wide Profile": IMG_BASE+"optical-line-zgl062.jpeg",
    "Optical Line Light — Slim Profile": IMG_BASE+"optical-line-zgl070.jpeg",
    "Ultra-Thin LED Panel Light": IMG_BASE+"panel-new.webp",
    "UFO High Bay Light": IMG_BASE+"highbay-new.webp",
    "LED Flood Light": IMG_BASE+"flood-light.jpg",
    "All-in-One Solar Street Light": IMG_BASE+"solar-street.jpg",
    "Architectural LED Wall Washer": IMG_BASE+"led-wall-washer.jpeg",
    "Commercial LED Wall Light": IMG_BASE+"wall-light-01.jpeg"
  };

  // Strategy 1: fix broken images globally
  document.addEventListener('error', function(e) {
    var t = e.target;
    if (t.tagName !== 'IMG' || t.dataset.fixed) return;
    var src = t.src || '';
    var fname = src.split('/').pop().split('?')[0];
    // check if this filename exists in our known images
    var known = false;
    for (var s in SLUG_IMG) { if (SLUG_IMG[s] === fname) { known = true; break; } }
    if (known && src.indexOf(IMG_BASE) === -1) {
      t.dataset.fixed = '1';
      t.src = IMG_BASE + fname;
    }
  }, true);

  // Strategy 2+3: inject thumbnails into cards
  function injectThumbs() {
    // collect all candidate card elements
    var els = document.querySelectorAll(
      '[class*="entryCard"], [class*="cardListing"], [class*="Card"], [class*="card"], a[href*="entries"], a[href*="/collections/"]'
    );
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.querySelector('img[data-thumb]')) continue;
      // skip if already has a visible (non-broken) img
      var existing = el.querySelector('img:not([data-thumb])');
      if (existing && existing.naturalWidth > 0) continue;

      var imgUrl = null;

      // Strategy 3: try href-based slug match
      var href = el.getAttribute('href') || '';
      var m = href.match(/\/entries\/(.+?)(?:[?#]|$)/);
      if (m && SLUG_IMG[m[1]]) {
        imgUrl = IMG_BASE + SLUG_IMG[m[1]];
      }

      // Strategy 2: try text-based name match
      if (!imgUrl) {
        var text = el.textContent || '';
        for (var name in NAME_IMG) {
          if (text.indexOf(name) >= 0) { imgUrl = NAME_IMG[name]; break; }
        }
      }

      if (imgUrl) {
        var img = document.createElement('img');
        img.src = imgUrl;
        img.setAttribute('data-thumb', '1');
        img.loading = 'lazy';
        img.style.cssText = 'width:100%;height:140px;object-fit:cover;border-radius:8px 8px 0 0;display:block;';
        // insert at the very beginning
        if (el.children.length > 0) {
          el.insertBefore(img, el.firstChild);
        } else {
          el.appendChild(img);
        }
      }
    }
  }

  var thumbObs = new MutationObserver(function() { setTimeout(injectThumbs, 50); });
  var thumbCheck = setInterval(function() {
    if (document.querySelector('[class*="nc-"], [class*="cms"], [id*="nc-"]')) {
      clearInterval(thumbCheck);
      thumbObs.observe(document.body, { childList: true, subtree: true });
      injectThumbs();
    }
  }, 500);
  window.addEventListener('hashchange', function() { setTimeout(injectThumbs, 500); });
  </script>
</body>
</html>
