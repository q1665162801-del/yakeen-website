<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Yakeen 产品管理后台</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { margin: 0; }
    .login-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .login-card {
      background: #16213e;
      padding: 48px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      text-align: center;
      max-width: 400px;
    }
    .login-card h1 { font-size: 24px; margin: 0 0 8px; color: #d4af37; }
    .login-card p { font-size: 14px; color: #888; margin: 0 0 24px; }
    .login-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #d4af37;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform .2s;
    }
    .login-btn:hover { transform: scale(1.05); }
    .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>Yakeen Admin</h1>
      <p>产品管理后台</p>
      <div id="error" class="error-msg"></div>
      <a href="/api/oauth" class="login-btn">Login with GitHub</a>
    </div>
  </div>
  <script>
  (function() {
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);

    // Handle OAuth error from full-page redirect
    if (params.get('error')) {
      document.getElementById('error').textContent = decodeURIComponent(params.get('error'));
      document.getElementById('login').style.display = 'flex';
      history.replaceState(null, '', window.location.pathname);
      return;
    }

    // Check if already authenticated
    if (!localStorage.getItem('netlify-cms-user')) {
      // Not authenticated — show our login page (full-page redirect, no popup)
      document.getElementById('login').style.display = 'flex';
      return;
    }

    // Authenticated — dynamically load Decap CMS
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js';
    document.body.appendChild(s);

    // Fallback: localStorage relay for CMS's own popup-based login
    // (in case CMS doesn't recognize netlify-cms-user and shows its own login)
    var KEY = 'decap_cms_oauth';
    var prov = 'github';

    function relay(stored) {
      var origin = window.location.origin;
      var parsed;
      try { parsed = JSON.parse(stored); } catch(e) { return; }

      window.dispatchEvent(new MessageEvent('message', {
        data: 'authorizing:' + prov,
        origin: origin,
        source: window
      }));

      setTimeout(function() {
        var msgData;
        if (parsed.token) {
          msgData = 'authorization:' + prov + ':success:' + JSON.stringify(parsed);
        } else if (parsed.error) {
          msgData = 'authorization:' + prov + ':error:' + JSON.stringify({ msg: parsed.error });
        }
        if (msgData) {
          window.dispatchEvent(new MessageEvent('message', {
            data: msgData,
            origin: origin,
            source: window
          }));
        }
      }, 150);
    }

    var poll = setInterval(function() {
      var stored = localStorage.getItem(KEY);
      if (!stored) return;
      localStorage.removeItem(KEY);
      relay(stored);
    }, 400);

    setTimeout(function() { clearInterval(poll); }, 300000);
  })();
  </script>
</body>
</html>
