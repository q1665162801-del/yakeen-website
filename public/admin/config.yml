# ──────────────────────────────────────────────────────────
# Decap CMS 配置 — Yakeen 照明产品后台
# 字段完全匹配现有 Product 接口，零数据结构改动
# ──────────────────────────────────────────────────────────

backend:
  name: github
  repo: q1665162801-del/yakeen-website
  branch: main
  base_url: https://www.yakeenlighting.com
  auth_endpoint: /api/oauth

# 图片走 Git（先简单，超100张再迁移R2）
media_folder: "public/assets/images/products"
public_folder: "/assets/images/products"

# ─── 产品集合 ───────────────────────────────────────────
collections:
  - name: "products"
    label: "产品管理"
    label_singular: "产品"
    folder: "src/content/products"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{category}}"
    sortable_fields: [name, category]
    format: "json"
    extension: "json"
    view_filters:
      - label: "室内照明"
        field: category
        pattern: "indoor"
      - label: "轨道照明"
        field: category
        pattern: "track"
      - label: "面板线性"
        field: category
        pattern: "panel-linear"
      - label: "工业照明"
        field: category
        pattern: "industrial"
      - label: "室外照明"
        field: category
        pattern: "outdoor"

    fields:
      # ── 基础信息 ──
      - { label: "URL标识(slug)", name: "slug", widget: "string", hint: "URL中的产品标识，如：df-downlight。用小写字母和连字符，不要改已上线产品的slug" }
      - { label: "产品名称", name: "name", widget: "string", hint: "如：DF Series Commercial LED Downlight" }
      - { label: "简称", name: "shortName", widget: "string", hint: "如：LED Downlight" }
      - label: "产品分类"
        name: "category"
        widget: "select"
        options:
          - { label: "室内照明", value: "indoor" }
          - { label: "轨道照明", value: "track" }
          - { label: "面板线性", value: "panel-linear" }
          - { label: "工业照明", value: "industrial" }
          - { label: "室外照明", value: "outdoor" }
      - { label: "精选产品（首页展示）", name: "featured", widget: "boolean", default: false }
      - { label: "一句话标语", name: "tagline", widget: "string" }
      - { label: "产品描述", name: "description", widget: "text" }
      - { label: "SEO描述", name: "metaDescription", widget: "text", required: false }

      # ── 图片 ──
      - { label: "产品主图", name: "mainImage", widget: "image" }
      - { label: "OG分享图", name: "ogImage", widget: "image", required: false }
      - label: "产品图册（图片路径）"
        name: "galleryImages"
        widget: "list"
        required: false
        hint: "每行一张图片路径，如 /assets/images/products/xxx.jpg"
      - { label: "场景图", name: "sceneImage", widget: "image", required: false }

      # ── 技术规格（12个参数，匹配现有 ProductSpec 接口）──
      - label: "技术规格"
        name: "specs"
        widget: "object"
        fields:
          - { label: "功率(W)", name: "wattage", widget: "string" }
          - { label: "光效(lm/W)", name: "efficacy", widget: "string" }
          - { label: "色温(K)", name: "cct", widget: "string" }
          - { label: "显指 CRI", name: "cri", widget: "string", required: false }
          - { label: "光束角", name: "beamAngle", widget: "string", required: false }
          - { label: "IP等级", name: "ipRating", widget: "string", required: false }
          - { label: "调光方式", name: "dimming", widget: "string", required: false }
          - { label: "寿命", name: "lifespan", widget: "string", required: false }
          - { label: "质保", name: "warranty", widget: "string", required: false }
          - { label: "认证", name: "certifications", widget: "string", required: false }
          - { label: "MOQ", name: "moq", widget: "string", required: false }
          - { label: "交期", name: "leadTime", widget: "string", required: false }

      # ── 应用场景 ──
      - label: "应用场景"
        name: "applications"
        widget: "list"
        required: false
        fields:
          - { label: "场景名称", name: "title", widget: "string" }
          - { label: "描述", name: "desc", widget: "string", required: false }
          - { label: "图标", name: "icon", widget: "string", required: false, hint: "如：mall, hotel, retail, office" }

      # ── 产品特性（纯字符串数组 string[]）──
      - label: "产品特性"
        name: "features"
        widget: "list"
        required: false
        hint: "每行一条产品特性"

      # ── 常见问题 ──
      - label: "常见问题"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "问题", name: "question", widget: "string" }
          - { label: "回答", name: "answer", widget: "text" }

      # ── 案例展示 ──
      - label: "案例展示"
        name: "caseStudy"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "案例标题", name: "title", widget: "string" }
          - { label: "地点", name: "location", widget: "string" }
          - { label: "年份", name: "year", widget: "string", required: false }
          - { label: "案例图片", name: "image", widget: "image", required: false }

      # ── 阿拉伯语本地化 ──
      - label: "阿拉伯语本地化"
        name: "ar"
        widget: "object"
        collapsed: true
        required: false
        hint: "阿拉伯语翻译，不填则英文版直接显示"
        fields:
          - { label: "阿语名称", name: "name", widget: "string", required: false }
          - { label: "阿语简称", name: "shortName", widget: "string", required: false }
          - { label: "阿语标语", name: "tagline", widget: "string", required: false }
          - { label: "阿语描述", name: "description", widget: "text", required: false }
          - label: "阿语特性"
            name: "features"
            widget: "list"
            required: false
            hint: "每行一条阿语特性"
          - label: "阿语应用场景"
            name: "applications"
            widget: "list"
            required: false
            fields:
              - { label: "场景名称", name: "title", widget: "string" }
              - { label: "描述", name: "desc", widget: "string", required: false }
          - label: "阿语常见问题"
            name: "faqs"
            widget: "list"
            required: false
            fields:
              - { label: "问题", name: "question", widget: "string" }
              - { label: "回答", name: "answer", widget: "text" }
          - label: "阿语案例"
            name: "caseStudy"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "案例标题", name: "title", widget: "string" }
              - { label: "地点", name: "location", widget: "string" }
