<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" fill="none">
  <!-- Light beam icon -->
  <g transform="translate(4, 4)">
    <circle cx="20" cy="20" r="10" fill="#C9A961" opacity="0.15"/>
    <circle cx="20" cy="20" r="7" fill="#C9A961" opacity="0.3"/>
    <circle cx="20" cy="20" r="4" fill="#C9A961"/>
    <!-- Light rays -->
    <line x1="20" y1="2" x2="20" y2="7" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="33" x2="20" y2="38" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="7" y2="20" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="20" x2="38" y2="20" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="7.5" y1="7.5" x2="11" y2="11" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="29" x2="32.5" y2="32.5" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="7.5" y1="32.5" x2="11" y2="29" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="11" x2="32.5" y2="7.5" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Yakeen text -->
  <text x="56" y="32" font-family="Manrope, sans-serif" font-size="22" font-weight="800" fill="#1a2744">Yakeen</text>
  <!-- Lighting text -->
  <text x="140" y="32" font-family="Manrope, sans-serif" font-size="22" font-weight="300" fill="#C9A961">Lighting</text>
</svg>