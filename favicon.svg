<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 灯泡主体：亮黄 → 暖金 渐变 -->
    <linearGradient id="bulbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="55%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4A84B"/>
    </linearGradient>
    <!-- 螺纹底座：深金棕渐变 -->
    <linearGradient id="screwBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5210"/>
      <stop offset="100%" stop-color="#4A3B0D"/>
    </linearGradient>
    <!-- 灯丝光晕 -->
    <radialGradient id="filamentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFEC8B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <!-- 背景底（白） -->
    <pattern id="whiteBg" width="1" height="1" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- 纯白圆角背景 -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF"/>
  <!-- 微妙暖色描边（让白底不显得太硬） -->
  <rect width="64" height="64" rx="16" fill="none" stroke="#E8DFC9" stroke-width="1"/>

  <!-- 灯泡玻璃主体（美工感形状：顶部圆润、底部略收） -->
  <path d="
    M32 12
    C23 12 16 19 16 28
    C16 33 18 36 21 39
    L21 42
    L43 42
    L43 39
    C46 36 48 33 48 28
    C48 19 41 12 32 12 Z"
    fill="url(#bulbBody)"/>

  <!-- 玻璃高光月牙（左上，营造玻璃质感） -->
  <path d="
    M24 18
    C27 15 32 14 36 16
    C34 15 31 15 28 17
    C25 19 24 22 24 25
    C24 22 24 20 25 18 Z"
    fill="rgba(255,255,255,0.55)"/>

  <!-- 灯丝光晕（让灯泡有亮着的感觉） -->
  <circle cx="32" cy="30" r="7" fill="url(#filamentGlow)"/>

  <!-- 灯丝本体（更亮更细） -->
  <circle cx="32" cy="30" r="3.2" fill="#FFF9C4"/>

  <!-- 螺纹底座（3 条渐细的横线） -->
  <rect x="23" y="42" width="18" height="3.2" rx="1.2" fill="url(#screwBody)"/>
  <rect x="24" y="47" width="16" height="2.6" rx="1" fill="url(#screwBody)"/>
  <rect x="25" y="51.5" width="14" height="2.2" rx="0.8" fill="url(#screwBody)"/>

  <!-- 螺纹底部接触点 -->
  <rect x="26" y="55" width="12" height="1.5" rx="0.6" fill="#3D2F0A"/>
</svg>
