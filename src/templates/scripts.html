  <script>
    // Self-healing: unregister any stale service workers from legacy PWA.
    // Old SWs cached outdated HTML/CSS and served broken pages; this
    // ensures every visitor gets a clean, up-to-date experience.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
      // Also try to clear any cached assets from the old PWA
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    }
  </script>
  <script src="{{base}}js/{{jsFile}}" defer></script>
