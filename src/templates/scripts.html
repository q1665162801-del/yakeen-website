  <script>
    // Self-healing: unregister any stale service workers from legacy PWA.
    // Old SWs cached outdated HTML/CSS and served broken pages; this
    // ensures every visitor gets a clean, up-to-date experience.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
      // Also try to clear any cached assets from the old PWA
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    }
  </script>
  <script>
    // Defer manifest until after LCP — it pulls from a third origin (or same
    // origin but the browser may assign it a high priority). We need the hero,
    // CSS, and JS to load first for a fast first paint.
    window.addEventListener('load', function() {
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = document.querySelector('link[rel="canonical"]')
        ? new URL('/manifest.webmanifest', document.querySelector('link[rel="canonical"]').href).href
        : '/manifest.webmanifest';
      document.head.appendChild(link);
    });
  </script>
  <script src="{{base}}js/{{jsFile}}" defer></script>
