<meta charset="UTF-8">
  <script>
  /* SW purge — legacy PWA service workers kept serving stale pages.
     Unregister ANY service worker + clear Cache Storage on every load;
     one auto-reload (session-guarded) so the first visit is already fresh. */
  (function(){
    if(!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function(rs){
      if(!rs.length) return;
      Promise.all(rs.map(function(r){ return r.unregister(); })).then(function(){
        if(window.caches && caches.keys){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
        try{
          if(sessionStorage.getItem('swPurged')!=='1'){
            sessionStorage.setItem('swPurged','1');
            location.reload();
          }
        }catch(e){}
      });
    }).catch(function(){});
  })();
  </script>
